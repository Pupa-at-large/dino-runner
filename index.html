<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f7f6f1" />
<meta name="description" content="A minimal level-based runner game — clear each level's finish line to advance. Plays on mobile and desktop." />
<title>Dino Runner</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="hud-item">
      <span class="hud-label">LEVEL</span>
      <span id="level" class="hud-value">1</span>
    </div>
    <button id="soundBtn" class="icon-btn" aria-label="Toggle sound">♪</button>
    <div class="hud-item">
      <span class="hud-label">SCORE</span>
      <span id="score" class="hud-value">00000</span>
    </div>
  </header>

  <div class="progress-wrap">
    <div class="progress-track">
      <div id="progressFill" class="progress-fill"></div>
      <div id="progressDino" class="progress-dino">🦖</div>
    </div>
    <span id="progressFlag" class="progress-flag">⚑</span>
  </div>

  <div id="stage" class="stage">
    <canvas id="game"></canvas>

    <!-- Title / start overlay -->
    <div id="overlay" class="overlay">
      <h1 id="ovTitle" class="overlay-title">Dino Runner</h1>
      <p id="ovSub" class="overlay-sub">Tap or press space to start</p>
      <p class="overlay-hint">Tap / space / ↑ to jump · hold / ↓ to duck</p>
      <button id="levelSelectBtn" class="pill-btn">Select level</button>
    </div>

    <!-- Level clear overlay -->
    <div id="clearOverlay" class="overlay hidden">
      <p class="clear-kicker">Level cleared</p>
      <h1 id="clearTitle" class="overlay-title">Level 1</h1>
      <p id="clearStats" class="overlay-sub">Score 00420 · Best 00500</p>
      <button id="nextBtn" class="pill-btn primary">Next level →</button>
    </div>

    <!-- Level select overlay -->
    <div id="selectOverlay" class="overlay hidden">
      <h1 class="overlay-title">Select level</h1>
      <p class="overlay-sub">Cleared levels are unlocked</p>
      <div id="levelGrid" class="level-grid"></div>
      <button id="selectBackBtn" class="text-btn">Back</button>
    </div>
  </div>

  <div class="controls">
    <button id="jumpBtn" class="ctrl-btn" aria-label="Jump">JUMP</button>
    <button id="duckBtn" class="ctrl-btn" aria-label="Duck">DUCK</button>
  </div>

  <footer class="foot">
    <button id="resetBtn" class="text-btn">Restart level</button>
    <span class="foot-sep">·</span>
    <span id="footNote" class="foot-note">Reach the flag to clear the level</span>
  </footer>
</div>

<script src="game.js"></script>
</body>
</html>
