document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

le=\"font-size:9px;color:#9a988f;margin-top:1px\">头戴冠冕<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1;text-align:center\"><div style=\"height:120px;display:flex;align-items:flex-end;justify-content:center\"><dc-import name=\"DinoForm\" form=\"10\" hint-size=\"96px,100px\" style=\"display:block;color:#1a1a1a;--eye:#fff;--hot:#e8552d;transform:scale(1.18);transform-origin:bottom\"><\u002Fdc-import><\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:#e8552d;margin-top:14px\">Lv 46–50<\u002Fdiv><div style=\"font-weight:700;font-size:13px;color:#1a1a1a;margin-top:2px\">巨龙 ★<\u002Fdiv><div class=\"mono\" style=\"font-size:9px;color:#9a988f;margin-top:1px\">双角·背鳍·翼<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- DOUBLE JUMP SKILL -->\n<div style=\"position:absolute;left:80px;top:2812px;width:820px\">\n  <div data-drags-parent=\"1\" class=\"lbl\" style=\"position:absolute;top:-22px;left:2px\">技能 · 二段跳<\u002Fdiv>\n  <div class=\"card\" style=\"padding:26px 28px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><div class=\"sec\">Double Jump<\u002Fdiv><div class=\"mono\" style=\"font-size:12px;color:#9a988f\">TAP ×2 · 空中再点一次<\u002Fdiv><\u002Fdiv>\n    <div style=\"position:relative;height:170px;margin-top:16px;border:1px solid #ececea;border-radius:6px;background:#faf9f7;overflow:hidden\">\n      <div style=\"position:absolute;bottom:24px;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,#1a1a1a 0 8px,transparent 8px 14px)\"><\u002Fdiv>\n      <!-- dino -->\n      <div style=\"position:absolute;bottom:26px;left:18px;color:#1a1a1a;transform:scale(.78);transform-origin:bottom left\"><dc-import name=\"Glyph\" type=\"dino\" pose=\"run\" hint-size=\"72px,68px\" style=\"display:block;color:#1a1a1a;--eye:#faf9f7\"><\u002Fdc-import><\u002Fdiv>\n      <!-- big cactus -->\n      <div style=\"position:absolute;bottom:26px;right:70px;color:#1a1a1a;transform:scale(1.55);transform-origin:bottom\"><dc-import name=\"Glyph\" type=\"cactus\" pose=\"run\" hint-size=\"72px,68px\" style=\"display:block;color:#1a1a1a\"><\u002Fdc-import><\u002Fdiv>\n      <div class=\"mono\" style=\"position:absolute;bottom:30px;right:18px;font-size:9px;color:#9a988f;text-align:center;line-height:1.3\">大仙人掌<br>需②段跳<\u002Fdiv>\n      <!-- arc dots -->\n      <div style=\"position:absolute;bottom:50px;left:96px;width:6px;height:6px;border-radius:50%;background:#e8552d\"><\u002Fdiv>\n      <div style=\"position:absolute;bottom:78px;left:140px;width:6px;height:6px;border-radius:50%;background:#e8552d;opacity:.9\"><\u002Fdiv>\n      <div style=\"position:absolute;bottom:70px;left:184px;width:6px;height:6px;border-radius:50%;background:#e8552d;opacity:.85\"><\u002Fdiv>\n      <div style=\"position:absolute;bottom:100px;left:232px;width:6px;height:6px;border-radius:50%;background:#e8552d;opacity:.8\"><\u002Fdiv>\n      <div style=\"position:absolute;bottom:124px;left:300px;width:7px;height:7px;border-radius:50%;background:#e8552d\"><\u002Fdiv>\n      <div style=\"position:absolute;bottom:118px;left:372px;width:6px;height:6px;border-radius:50%;background:#e8552d;opacity:.8\"><\u002Fdiv>\n      <div style=\"position:absolute;bottom:96px;left:444px;width:6px;height:6px;border-radius:50%;background:#e8552d;opacity:.7\"><\u002Fdiv>\n      <div style=\"position:absolute;bottom:64px;left:516px;width:6px;height:6px;border-radius:50%;background:#e8552d;opacity:.55\"><\u002Fdiv>\n      <!-- tap markers -->\n      <div class=\"mono\" style=\"position:absolute;bottom:34px;left:78px;font-size:9px;color:#fff;background:#e8552d;border-radius:9px;padding:2px 7px\">TAP ①<\u002Fdiv>\n      <div class=\"mono\" style=\"position:absolute;bottom:84px;left:166px;font-size:9px;color:#fff;background:#1a1a1a;border-radius:9px;padding:2px 7px\">TAP ②<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mono\" style=\"font-size:11px;color:#9a988f;margin-top:14px;line-height:1.55\">第一次点击起跳 → 在最高点前任意时刻<b style=\"color:#1a1a1a\">再点一次<\u002Fb>触发二段跳,获得额外高度。普通仙人掌单跳即可,<b style=\"color:#e8552d\">大仙人掌<\u002Fb>单跳高度不足,必须二段跳越过。<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- EVOLUTION RULES -->\n<div style=\"position:absolute;left:920px;top:2812px;width:800px\">\n  <div data-drags-parent=\"1\" class=\"lbl\" style=\"position:absolute;top:-22px;left:2px\">进化机制<\u002Fdiv>\n  <div class=\"card\" style=\"padding:26px 28px\">\n    <div class=\"sec\">Progression Rules<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px\">\n      <div style=\"border:1px solid #ececea;border-radius:6px;padding:16px\"><div class=\"mono\" style=\"font-size:10px;color:#e8552d\">节奏<\u002Fdiv><div style=\"font-size:14px;color:#1a1a1a;margin-top:4px;font-weight:600\">每 5 关进化一次<\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:#9a988f;margin-top:4px;line-height:1.4\">50 关 = 10 形态 · 蛋 → 巨龙<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #ececea;border-radius:6px;padding:16px\"><div class=\"mono\" style=\"font-size:10px;color:#e8552d\">体型<\u002Fdiv><div style=\"font-size:14px;color:#1a1a1a;margin-top:4px;font-weight:600\">逐级变大<\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:#9a988f;margin-top:4px;line-height:1.4\">scale .58 → 1.18 · 命中盒同步<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #ececea;border-radius:6px;padding:16px\"><div class=\"mono\" style=\"font-size:10px;color:#e8552d\">华丽阶<\u002Fdiv><div style=\"font-size:14px;color:#1a1a1a;margin-top:4px;font-weight:600\">Lv36+ 引入强调色<\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:#9a988f;margin-top:4px;line-height:1.4\">鬃冠 / 王冠 / 翼 / 腹纹 用 #E8552D<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #ececea;border-radius:6px;padding:16px\"><div class=\"mono\" style=\"font-size:10px;color:#e8552d\">进化瞬间<\u002Fdiv><div style=\"font-size:14px;color:#1a1a1a;margin-top:4px;font-weight:600\">脉冲 + 回弹<\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:#9a988f;margin-top:4px;line-height:1.4\">强调色闪光 + 0.3s 缩放回弹动画<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:16px;background:#faf9f7;border-left:3px solid #e8552d;border-radius:3px;padding:14px 16px\">\n      <div class=\"mono\" style=\"font-size:11px;color:#55534d;line-height:1.6\">部件全部为几何件叠加:<b style=\"color:#1a1a1a\">背脊/背鳍/角<\u002Fb>用主体色三角,<b style=\"color:#e8552d\">鬃冠/王冠/翼/腹纹<\u002Fb>用强调色 → 同一恐龙基座上层层加件,保证整组造型语言统一、可程序化拼装。<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
